<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sofía — Escena 4: La Consulta</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#110e16;--card:rgba(22,18,28,.95);--gold:#d4a574;--gold2:#b8895a;--pain:#c45c4b;--text:#ece8e2;--dim:#9a9590;--dim2:#6a6560}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Crimson Text',Georgia,serif}
#game{width:100vw;height:100vh;display:none;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr auto;overflow:hidden}
#LP{grid-column:1;grid-row:1/4;background:linear-gradient(180deg,rgba(22,18,28,.98),rgba(15,12,20,.99));border-right:1px solid rgba(212,165,116,.1);padding:18px 16px;overflow-y:auto;z-index:20}
.lpt{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase}
.lpck{font-size:2.2rem;color:var(--text);font-weight:600;font-family:'DM Sans',sans-serif;margin:2px 0 8px}
.lpsec{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold2);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px;border-top:1px solid rgba(212,165,116,.1);padding-top:12px}
.cq{background:rgba(212,165,116,.05);border:1px solid rgba(212,165,116,.08);border-left:3px solid var(--gold2);border-radius:6px;padding:10px 12px;margin-bottom:8px;animation:sR .4s ease}
.cq b{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold);display:block;margin-bottom:3px;letter-spacing:.05em;text-transform:uppercase}
.cq span{font-size:.85rem;color:var(--dim);line-height:1.5}
@keyframes sR{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
#TB{grid-column:2;grid-row:1;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:15;background:var(--bg)}
#loc{font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--bg);background:var(--gold);padding:5px 16px;border-radius:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#obox{background:var(--card);border:1px solid rgba(212,165,116,.12);border-radius:8px;padding:10px 16px;max-width:320px}
.ol{font-family:'DM Sans',sans-serif;font-size:.6rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.ot{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--dim);line-height:1.4}
#timer{font-family:'DM Sans',sans-serif;font-size:1.8rem;font-weight:700;color:var(--gold);text-align:center;margin-top:6px;transition:color .3s}
#timer.low{color:var(--pain);animation:tblink 1s infinite}
@keyframes tblink{0%,100%{opacity:1}50%{opacity:.5}}
#RA{grid-column:2;grid-row:2;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#RW{position:relative;width:720px;height:505px;image-rendering:pixelated;border-radius:6px;overflow:hidden}
#RW .bg{width:100%;height:100%;display:block;image-rendering:pixelated}
#dov{position:absolute;inset:0;background:rgba(8,5,20,.2);pointer-events:none;transition:opacity 2s}
#pov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 120px rgba(196,92,75,.8),inset 0 0 200px rgba(196,92,75,.4)}
.sp{position:absolute;image-rendering:pixelated;z-index:10}
#ss{width:54px;height:54px;z-index:11}
#drsp{width:54px;height:54px;z-index:10}
#BB{grid-column:2;grid-row:3;z-index:30}
#dlg{background:linear-gradient(180deg,rgba(22,18,28,.97),rgba(12,10,16,.99));border-top:2px solid rgba(212,165,116,.15);padding:16px 24px;display:flex;gap:20px;align-items:flex-start;min-height:150px;opacity:0;transform:translateY(10px);transition:all .35s;pointer-events:none;position:relative}
#dlg.on{opacity:1;transform:none;pointer-events:auto}
#dp{width:110px;height:154px;border-radius:8px;border:2px solid rgba(212,165,116,.15);overflow:hidden;flex-shrink:0;background:rgba(20,16,26,.8)}
#dp img{width:100%;height:100%;object-fit:cover}
#dc{flex:1}
#ds{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600}
#dt{font-size:1.15rem;line-height:1.75;color:var(--text);min-height:2.5em}
#dt.i{color:var(--dim);font-style:italic}
#dt.p{color:var(--pain);font-style:italic;font-weight:600}
#dh{position:absolute;bottom:10px;right:24px;font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--dim2);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:.7}}
#ch{padding:16px 24px;background:linear-gradient(180deg,rgba(22,18,28,.97),rgba(12,10,16,.99));border-top:2px solid rgba(212,165,116,.15);display:none}
#ch.on{display:block}
.cb{display:block;width:100%;text-align:left;background:rgba(212,165,116,.04);border:1px solid rgba(212,165,116,.12);color:var(--text);font-family:'Crimson Text',serif;font-size:1.05rem;padding:12px 18px;margin-bottom:8px;border-radius:8px;cursor:pointer;transition:all .2s}
.cb:hover{background:rgba(212,165,116,.12);border-color:var(--gold)}
.cb small{display:block;color:var(--dim);font-size:.85rem;margin-top:3px;font-style:italic}
#notes{display:none;position:absolute;inset:0;z-index:25;padding:30px;background:rgba(17,14,22,.97);overflow-y:auto}
#notes.on{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-content:start}
.ncol{background:var(--card);border-radius:10px;padding:24px;border:1px solid rgba(212,165,116,.1)}
.ncol h3{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid rgba(212,165,116,.1)}
.ncol p{font-size:1rem;line-height:1.8;margin-bottom:10px}
.nl p{color:var(--text);font-style:italic}
.nr p{color:var(--dim);font-family:'DM Sans',sans-serif;font-size:.88rem}
#verdict{display:none;position:absolute;inset:0;z-index:30;background:rgba(17,14,22,.98);flex-direction:column;align-items:center;justify-content:flex-start;padding:50px 40px;overflow-y:auto}
#verdict.on{display:flex}
#verdict h2{color:var(--pain);font-family:'DM Sans',sans-serif;font-size:1.2rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem}
#verdict p{color:var(--text);font-size:1.05rem;line-height:1.8;max-width:520px;text-align:center;margin-bottom:.6rem}
#verdict .dim{color:var(--dim);font-size:1rem}
#TS{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#TS.off{opacity:0;pointer-events:none}
#TS h1{font-size:clamp(2rem,6vw,3.5rem);color:var(--gold);letter-spacing:.12em;font-weight:400}
#TS .sub{font-size:clamp(.85rem,2.5vw,1.1rem);color:var(--dim);font-style:italic;margin:.3rem 0 .2rem}
#TS .num{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:2rem}
#TS button{background:none;border:1px solid var(--gold2);color:var(--gold);padding:.8rem 3rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;transition:all .3s}
#TS button:hover{background:var(--gold);color:var(--bg)}
#F{position:fixed;inset:0;z-index:150;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:center}
#F.on{opacity:1;pointer-events:auto}
.ft{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.25em;text-transform:uppercase;opacity:0;transition:opacity .5s}
.fm{font-size:clamp(1.5rem,5vw,2.8rem);color:var(--text);margin-top:.5rem;font-weight:400;opacity:0;transition:opacity .5s}
#F.st .ft,#F.st .fm{opacity:1}
@media(max-width:960px){#game{grid-template-columns:1fr}#LP{display:none}#RW{width:100%}#notes.on{grid-template-columns:1fr}}
</style>
</head>

const G={tone:0,symptoms:[],toneLabel:"",tv:900,tr:false};
const TONES=["Directa","Minimizando","Emocional"];
const $=s=>document.querySelector(s);
const W=ms=>new Promise(r=>setTimeout(r,ms));
const MAX_CQ=5;
let _tid=0,_adv=null;
function say(sp,tx,po,cl){
return new Promise(res=>{
clearTimeout(_tid);if(_adv){$("#dlg").removeEventListener("click",_adv);document.removeEventListener("keydown",_adv);_adv=null;}
const d=$("#dlg"),t=$("#dt"),im=$("#di");
$("#ds").textContent=sp||"";t.className=cl==="i"?"i":cl==="p"?"p":"";
if(po&&P[po]){im.src=P[po];$("#dp").style.display="block";}else{$("#dp").style.display="none";}
t.textContent="";d.classList.add("on");
let i=0,chars=[...tx],done=false;
const tp=()=>{if(i<chars.length&&!done){t.textContent+=chars[i++];_tid=setTimeout(tp,16);}};tp();
let _adv_fired=false;const adv=(e)=>{if(e&&e.type==="keydown"&&e.key!==" "&&e.key!=="Enter")return;if(e){try{e.preventDefault();e.stopPropagation();}catch(_){}}if(_adv_fired&&i>=chars.length)return;if(i<chars.length){done=true;clearTimeout(_tid);t.textContent=tx;i=chars.length;return;}_adv_fired=true;d.removeEventListener("click",adv);document.removeEventListener("keydown",adv);_adv=null;d.classList.remove("on");setTimeout(res,150);};
_adv=adv;setTimeout(()=>{d.addEventListener("click",adv);document.addEventListener("keydown",adv);},100);});}

function choose(opts){return new Promise(res=>{
const c=$("#ch");c.innerHTML="";
opts.forEach((o,i)=>{const b=document.createElement("button");b.className="cb";
b.innerHTML=o.t+(o.s?`<small>${o.s}</small>`:"");b.onclick=()=>{c.classList.remove("on");res(i);};c.appendChild(b);});
c.classList.add("on");});}

async function fi(a,b){const f=$("#F");f.classList.add("on");f.classList.remove("st");await W(800);
if(a||b){$(".ft").textContent=a||"";$(".fm").textContent=b||"";f.classList.add("st");await W(2200);f.classList.remove("st");await W(500);}}
async function fo(){$("#F").classList.remove("on");await W(800);}
async function pf(ms){$("#pov").style.opacity="1";await W(ms);$("#pov").style.opacity="0";}
function ac(t,x){const l=$("#cql");if(l.children.length>=MAX_CQ)l.removeChild(l.firstChild);
const d=document.createElement("div");d.className="cq";d.innerHTML=`<b>${t}</b><span>${x}</span>`;l.appendChild(d);}
function so(t){$("#otx").textContent=t;}
function clk(t){$("#clk").textContent=t;}
function ut(){const m=Math.floor(G.tv/60),s=G.tv%60;const el=$("#timer");
el.textContent=`⏱ ${m}:${s.toString().padStart(2,"0")}`;
if(G.tv<300)el.classList.add("low");else el.classList.remove("low");}

// ===== EL ENSAYO — high stakes, dramatic, confirmation required =====
async function ensayo(){
so("Prepárate. Todo depende de esto.");

// Sofia observes the doctor first
await say("","El consultorio huele a cloro y café frío. Luz fluorescente. Un escritorio metálico. Una camilla con papel. Un póster de anatomía en la pared.","s_n","");
await say("","El doctor está de pie frente a la camilla. Revisa algo en su celular. No me ha mirado. Tiene ojeras. La bata arrugada. Se pasa la mano por la cara como si acabara de salir de otra consulta. Un termo de café frío en el escritorio.","s_n","i");
await say("","Se ve agotado. No como yo. Agotado de otra forma. De cuarenta pacientes al día. De un sistema que le pide milagros sin darle nada.","s_s","i");

await say("","Tengo que prepararme. Es ahora. Ahora o nunca.","s_c","i");
await say("","Llevo dos años esperando este momento. Dos años de ibuprofeno que no funciona. De noches sin dormir. De días que falto al trabajo. De mentirle a mamá. Todo para llegar aquí, a esta silla, frente a este doctor.","s_f","i");
await say("","Si no digo las cosas correctas, me van a mandar a casa con otra receta. Otra vez. Como siempre. No puedo dejar que eso pase.","s_f","p");

// Choose symptoms
await say("","Tengo ocho síntomas. Solo hay tiempo para tres. Si elijo mal... si no menciono el correcto... si se me olvida algo...","s_c","i");
const all=["Dolor abdominal intenso durante la menstruación",
"Dolor FUERA de la menstruación — todo el mes",
"Dolor durante relaciones sexuales",
"Sangrado muy abundante y prolongado",
"Fatiga extrema","Náuseas frecuentes",
"Dolor al ir al baño","No puedo trabajar 2-3 días al mes"];

so("Elige el primer síntoma.");
const s1=await choose(all.map(s=>({t:s})));G.symptoms.push(all[s1]);
so("Elige el segundo síntoma.");
const r1=all.filter((_,i)=>i!==s1);
const s2=await choose(r1.map(s=>({t:s})));G.symptoms.push(r1[s2]);
so("Elige el tercero. El más importante.");
const r2=r1.filter((_,i)=>i!==s2);
const s3=await choose(r2.map(s=>({t:s})));G.symptoms.push(r2[s3]);

// Choose tone
await say("","Bien. Ahora: ¿cómo se lo digo? El tono importa. Importa más de lo que debería.","s_c","i");
so("Elige cómo hablar.");
G.tone=await choose([
{t:"Directa: «Doctor, llevo dos años con dolor severo.»",s:"Clara. Firme. Riesgo: puede parecer confrontacional."},
{t:"Minimizando: «Disculpe, doctor, tengo unos cólicos...»",s:"Suave. Educada. Riesgo: no la toman en serio."},
{t:"Emocional: «Doctor, ya no aguanto. Tengo miedo.»",s:"Honesta. Vulnerable. Riesgo: la catalogan como ansiosa."},
]);
G.toneLabel=TONES[G.tone];

// === CONFIRMATION — dramatic, high stakes ===
await say("","Repaso. Voy a decir:","s_c","i");
await say("","1. "+G.symptoms[0]+"\n2. "+G.symptoms[1]+"\n3. "+G.symptoms[2]+"\nTono: "+G.toneLabel,null,"");

await say("","Si me equivoco, me mandan a casa con naproxeno. Si me equivoco, pierdo otros dos meses. Si me equivoco, Mateo pierde a su maestra. Mamá trabaja triple turno. Canela espera en la puerta.","s_f","i");
await say("","Todo depende de estos once minutos. De estas tres frases. De este tono de voz. No debería ser así. Pero así es.","s_f","p");

const confirm=await choose([
{t:"Sí. Estoy lista. Esto es lo que voy a decir.",s:"No hay vuelta atrás."},
{t:"No. Quiero cambiar algo.",s:"Volver a elegir."},
]);
if(confirm===1){
  G.symptoms=[];
  await say("","No. Espera. Déjame repensar. Tengo que hacerlo bien.","s_c","i");
  so("Elige de nuevo el primer síntoma.");
  const s1b=await choose(all.map(s=>({t:s})));G.symptoms.push(all[s1b]);
  so("Segundo síntoma.");
  const r1b=all.filter((_,i)=>i!==s1b);
  const s2b=await choose(r1b.map(s=>({t:s})));G.symptoms.push(r1b[s2b]);
  so("Tercero.");
  const r2b=r1b.filter((_,i)=>i!==s2b);
  const s3b=await choose(r2b.map(s=>({t:s})));G.symptoms.push(r2b[s3b]);
  await say("","¿Y el tono?","s_c","i");
  G.tone=await choose([
  {t:"Directa",s:""},{t:"Minimizando",s:""},{t:"Emocional",s:""},
  ]);
  G.toneLabel=TONES[G.tone];
}

await say("","Lista. No hay vuelta atrás.","s_f","i");
}

// ===== CONSULTATION =====
async function consulta(){
so("La consulta.");clk("4:20 PM");
G.tv=900;G.tr=true;ut();
const iv=setInterval(()=>{if(!G.tr)return;G.tv--;if(G.tv<=0){G.tr=false;clearInterval(iv);}ut();},1000);

// Doctor looks up, apologizes for the wait
await say("","El doctor levanta la vista. Me mira por primera vez.","d_n","");
await say("Dr. Méndez","Buenas tardes, Sofía. Disculpa la espera. Estamos cortos de personal hoy. A ver...","d_n","");
await say("Dr. Méndez","Llevamos todo el día así. Nos quitaron a un médico el mes pasado y no lo han reemplazado. Pero bueno, estamos aquí. Vamos a ver qué podemos hacer.","d_s","");
await say("","Lo dice con cansancio. No conmigo. Con el sistema. Con las paredes de este consultorio que se caen a pedazos.","s_n","i");
await say("","Noto que el ultrasonido del rincón tiene un letrero pegado: «FUERA DE SERVICIO.» Lleva meses así. Doña Itzel tenía razón.","s_s","i");
await say("","El doctor revisa mi formulario. Tarda un momento. Pasa las hojas. Busca algo en mis datos.","d_n","i");
await say("","Me pregunto cuántas veces ha hecho esto hoy. Cuántas mujeres se sentaron donde estoy yo. Cuántas se fueron sin respuesta.","s_s","i");
await say("Dr. Méndez","Dismenorrea.","d_n","");
await say("","Dismenorrea. Así se lee «dos años de dolor que no me deja vivir» en lenguaje médico.","s_f","i");
G.tv=800;ut();

// Branch by tone — Sofia says EXACTLY her chosen symptoms
const symText=G.symptoms[0]+". "+G.symptoms[1]+". "+G.symptoms[2]+".";

if(G.tone===0){
// DIRECTA
await say("Sofía","Doctor, llevo dos años con esto. "+symText,"s_a","");
await say("","Lo digo rápido. Firme. Como lo ensayé.","s_a","i");
G.tv=720;ut();
await say("Dr. Méndez","Dos años. ¿Y hasta ahora vienes?","d_c","");
await say("","Hasta ahora vengo porque llevo seis meses intentando conseguir esta cita.","s_a","i");
await say("Dr. Méndez","Entiendo. Mira, esos síntomas que describes son bastante comunes. Sobre todo a tu edad. ¿Trabajas?","d_n","");
await say("Sofía","Soy maestra. De educación especial.","s_n","");
await say("Dr. Méndez","Eso es mucho estrés. El estrés puede manifestarse así. El cuerpo somatiza.","d_n","");
await say("","No. No me digas que es estrés. Lo he escuchado antes. El dolor es REAL. Lo siento cada día.","s_f","i");
}else if(G.tone===1){
// MINIMIZANDO
await say("Sofía","Disculpe, doctor, es que tengo unos cólicos. Bueno, no exactamente cólicos. Es... "+symText,"s_c","");
await say("","Lo digo bajito. Demasiado bajito.","s_s","i");
G.tv=750;ut();
await say("Dr. Méndez","¿Cólicos? ¿Desde cuándo?","d_n","");
await say("Sofía","Dos años. Más o menos.","s_s","");
await say("Dr. Méndez","¿Y has probado ibuprofeno?","d_n","");
await say("Sofía","Sí, 800 miligramos. Ya no me—","s_s","");
await say("Dr. Méndez","¿Cada cuánto lo tomas?","d_n","");
await say("","No me dejó terminar la frase. Como si ya supiera lo que voy a decir. Como si ya lo hubiera escuchado cuarenta veces hoy.","s_f","i");
}else{
// EMOCIONAL
await say("Sofía","Doctor, ya no aguanto. "+symText+" Tengo mucho miedo.","s_f","");
await say("","Se me quiebra la voz. Me tapo la boca.","s_f","p");
G.tv=730;ut();
await say("Dr. Méndez","Tranquila. Respira. Cuéntame despacio.","d_h","");
await say("","Ya estoy llorando. Ya pensó que estoy loca.","s_f","i");
await say("Dr. Méndez","¿Has tenido mucha ansiedad? ¿Problemas para dormir?","d_c","");
await say("","No puedo dormir porque ME DUELE. No porque tenga ansiedad.","s_a","i");
}

// PHYSICAL EXAM — all tones converge
G.tv=550;ut();so("Exploración física.");
await say("Dr. Méndez","Acuéstate aquí. Voy a revisarte.","d_n","");
await say("","Me acuesto en la camilla. El papel cruje. La luz del techo me ciega.","s_s","");
await say("","Presiona mi abdomen. Abajo. A la izquierda.","d_n","");
await pf(2500);
await say("","El dolor se dispara. Me agarro de la camilla con las dos manos. Aprieto los dientes.","s_f","p");
await say("Sofía","Ahí. Ahí duele.","s_f","");
await say("Dr. Méndez","Hay sensibilidad en la zona pélvica.","d_n","");

// KEY DISMISSAL — not "Dr. Google", something more systemic
G.tv=400;ut();so("La pregunta.");
await say("Sofía","Doctor... ¿podría ser endometriosis?","s_c","");
await say("","Me mira. Pausa.","d_c","");
await say("Dr. Méndez","Mira, Sofía. La endometriosis es algo muy específico. Requiere una laparoscopía para diagnosticarse, y no tenemos el equipo para eso aquí. Tendría que referirte, y la lista de espera...","d_n","");
await say("Dr. Méndez","Además, es muy poco probable a tu edad. Estos síntomas son más comunes de lo que crees. La mayoría de las mujeres los experimentan en algún momento.","d_n","");
await say("","La mayoría de las mujeres. Como si el dolor que me está destruyendo fuera una estadística.","s_f","i");
await say("","«Es muy poco probable a tu edad.» Eso no es cierto. Aparece desde la adolescencia. Pero no digo nada. Porque él es el doctor y yo soy la paciente.","s_s","i");

// PRESCRIPTION — varies slightly by tone
G.tv=250;ut();so("La receta.");
if(G.tone===0){
await say("Dr. Méndez","Te voy a recetar naproxeno 550 miligramos cada 12 horas. Y análisis de sangre generales. Si en dos meses sigue, regresa.","d_n","");
await say("","Análisis de sangre generales. No detectan endometriosis. Nada de lo que me recetó va a explicar lo que tengo.","s_f","i");
}else if(G.tone===1){
await say("Dr. Méndez","Mira, te voy a cambiar el medicamento. Naproxeno 550 cada 12 horas. Funciona mejor que el ibuprofeno. Y unos análisis para descartar cosas.","d_n","");
await say("","Descartar cosas. ¿Qué cosas? ¿Las cosas que no me quiere nombrar?","s_f","i");
}else{
await say("Dr. Méndez","Te voy a mandar naproxeno para el dolor y quiero que consideres hablar con alguien. Un psicólogo, tal vez. No porque no te crea, sino porque el estrés amplifica el dolor.","d_h","");
await say("","Un psicólogo. Me duele el vientre y me manda a un psicólogo.","s_a","i");
}

await say("Dr. Méndez","La lista de espera para ginecología es de cuatro a seis meses. Si empeora, ve a urgencias.","d_n","");
await say("","Cuatro a seis meses. Llevo veinticuatro. ¿Cuántos más?","s_f","i");

G.tr=false;clearInterval(iv);G.tv=138;ut();
await say("Dr. Méndez","Cuídate, Sofía. Cualquier cosa, regresas.","d_h","");

// FADE TO BLACK — no "she leaves", just cut
await fi("","");

// DOCTOR'S NOTES
so("Las notas del doctor.");
const toneNotes=[
"Paciente se presenta directa, refiere síntomas con claridad. Se solicitan estudios.",
"Paciente refiere molestias menstruales de intensidad moderada. Se ajusta analgesia.",
"Paciente se presenta angustiada, llanto durante consulta. Se recomienda valoración psicológica."
];
const notes=$("#notes");
notes.innerHTML=`
<div class="ncol nl"><h3>Lo que Sofía dijo</h3>
<p>«Llevo dos años con dolor constante.»</p>
<p>«${G.symptoms[0]}.»</p>
<p>«${G.symptoms[1]}.»</p>
<p>«${G.symptoms[2]}.»</p>
<p>«El ibuprofeno ya no funciona.»</p>
<p>«Falto al trabajo. No puedo dormir.»</p>
<p>«¿Podría ser endometriosis?»</p></div>
<div class="ncol nr"><h3>Lo que el doctor escribió</h3>
<p>Pte. femenina 24a refiere dismenorrea de 2 años de evolución.</p>
<p>${toneNotes[G.tone]}</p>
<p>Exploración: sensibilidad en hipogastrio.</p>
<p>Tx: Naproxeno 550mg c/12h.</p>
<p>Se solicitan BH, QS, PFH.</p>
<p>Revalorar 1-2 meses. Ref. ginecología pendiente.</p></div>`;
notes.classList.add("on");
// Add continue button to notes
const noteBtn=document.createElement("button");
noteBtn.textContent="▶ CONTINUAR";
noteBtn.style.cssText="grid-column:1/3;justify-self:center;margin-top:16px;background:none;border:1px solid var(--gold2);color:var(--gold);padding:.7rem 2.5rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px";
noteBtn.onmouseenter=()=>{noteBtn.style.background="var(--gold)";noteBtn.style.color="var(--bg)";};
noteBtn.onmouseleave=()=>{noteBtn.style.background="none";noteBtn.style.color="var(--gold)";};
notes.appendChild(noteBtn);
await fo();
await new Promise(r=>{noteBtn.onclick=r;});

// THE VERDICT — big, angry, direct to the player
notes.classList.remove("on");
await W(500);

const v=$("#verdict");
v.innerHTML=`
<h2>No importó lo que elegiste.</h2>
<p>Tres síntomas. Un tono. Once minutos.</p>
<p>Pudiste haber elegido cualquier combinación. El resultado es el mismo. Siempre es el mismo.</p>
<p>Sofía sale del consultorio con las manos temblando. La receta se le arruga en el puño. Camina al camión. Se sienta. Mira por la ventana.</p>
<p>No llora. Ya no tiene con qué.</p>
<p>En su casa, Canela la espera en la puerta. Mamá le pregunta cómo le fue.</p>
<p>Sofía dice: «Bien, ma. Me dieron unas pastillas.»</p>
<p>Y mamá le cree. Porque necesita creerle.</p>`;
// Add continue button to verdict
const vBtn=document.createElement("button");
vBtn.textContent="▶ CONTINUAR";
vBtn.style.cssText="margin-top:1.5rem;background:none;border:1px solid var(--gold2);color:var(--gold);padding:.7rem 2.5rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px";
vBtn.onmouseenter=()=>{vBtn.style.background="var(--gold)";vBtn.style.color="var(--bg)";};
vBtn.onmouseleave=()=>{vBtn.style.background="none";vBtn.style.color="var(--gold)";};
v.appendChild(vBtn);
v.classList.add("on");
await new Promise(r=>{vBtn.onclick=r;});
v.classList.remove("on");

// CONSEQUENCES
await say("","El día se acumula.","s_s","i");
ac("Diagnóstico","Ninguno.");await W(700);
ac("Receta","Naproxeno. El mismo de siempre con otro nombre.");await W(700);
ac("Próxima cita","1-2 meses.");await W(700);
ac("Especialista","4-6 meses de espera.");await W(700);
ac("El dolor","Sigue. Nadie sabe qué es.");await W(3000);

await fi("FIN DE ESCENA 4","La Consulta");await W(1200);
const fade=$("#F");$(".ft").textContent="ESCENA 4 — COMPLETA";$(".fm").textContent="La Consulta";fade.classList.add("st");
await W(800);
const ed=document.createElement("div");
ed.style.cssText="color:var(--dim);font-size:1.05rem;max-width:480px;text-align:center;line-height:1.8;margin-top:1.5rem;opacity:0;transition:opacity 1s";
ed.textContent="El Dr. Méndez no es un villano. Está cansado, sin herramientas, y genuinamente cree que está ayudando dentro de lo que el sistema le permite. Eso es lo que lo hace tan devastador.";
fade.appendChild(ed);await W(100);ed.style.opacity="1";
const btnRow=document.createElement("div");
btnRow.style.cssText="margin-top:2rem;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity 1s";
const btn=document.createElement("button");
btn.textContent="▶ Continuar";
btn.style.cssText="margin-top:2rem;background:none;border:1px solid var(--gold2);color:var(--gold);padding:.7rem 2.5rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;pointer-events:auto";
let _navFired=false;
btn.onclick=()=>{if(_navFired)return;_navFired=true;btn.disabled=true;try{const prog=JSON.parse(localStorage.getItem("sofia_progress")||"[]");if(!prog.includes("s4"))prog.push("s4");localStorage.setItem("sofia_progress",JSON.stringify(prog));localStorage.setItem("sofia_completed_chapter","s4");localStorage.setItem("sofia_current_scene","s5");}catch(e){}location.href="hub.html";};
btnRow.appendChild(btn);
const btnRep=document.createElement("button");
btnRep.textContent="↻ Repetir capítulo";
btnRep.style.cssText="margin-top:2rem;background:none;border:1px solid var(--gold2);color:var(--gold);padding:.7rem 2.5rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;pointer-events:auto";btnRep.style.opacity="0.7";
btnRep.onclick=()=>{if(_navFired)return;_navFired=true;location.reload();};
btnRow.appendChild(btnRep);
fade.appendChild(btnRow);
setTimeout(()=>btnRow.style.opacity="1",100);
}

let _started=false;
async function go(){
if(_started)return;_started=true;
$("#TS").classList.add("off");await W(1000);
document.getElementById("TS").remove();
document.getElementById("game").style.display="grid";
ac("La espera","2 horas y 15 minutos con dolor.");
ac("Los niños","Lucía cubrió otra vez.");
ac("Ibuprofeno","6 pastillas hoy.");
await ensayo();
await consulta();
}

try {
  localStorage.setItem("sofia_current_scene", "s4");
  const progress = JSON.parse(localStorage.getItem("sofia_progress") || "[]");
  if (!progress.includes("s4")) {
    progress.push("s4");
    localStorage.setItem("sofia_progress", JSON.stringify(progress));
  }
} catch(e) {}

</script>
