<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sofía — Escena 3: La Sala de Espera</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#110e16;--card:rgba(22,18,28,.95);--gold:#d4a574;--gold2:#b8895a;--pain:#c45c4b;--text:#ece8e2;--dim:#9a9590;--dim2:#6a6560}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Crimson Text',Georgia,serif}
#game{width:100vw;height:100vh;display:none;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr auto;overflow:hidden}
#LP{grid-column:1;grid-row:1/4;background:linear-gradient(180deg,rgba(22,18,28,.98),rgba(15,12,20,.99));border-right:1px solid rgba(212,165,116,.1);padding:18px 16px;overflow-y:auto;z-index:20}
.lpt{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase}
.lpck{font-size:2.2rem;color:var(--text);font-weight:600;font-family:'DM Sans',sans-serif;margin:2px 0 8px}
.lpsec{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold2);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px;border-top:1px solid rgba(212,165,116,.1);padding-top:12px}
.cq{background:rgba(212,165,116,.05);border:1px solid rgba(212,165,116,.08);border-left:3px solid var(--gold2);border-radius:6px;padding:10px 12px;margin-bottom:8px;animation:sR .4s ease}
.cq b{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold);display:block;margin-bottom:3px;letter-spacing:.05em;text-transform:uppercase}
.cq span{font-size:.85rem;color:var(--dim);line-height:1.5}
@keyframes sR{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
#TB{grid-column:2;grid-row:1;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:15;background:var(--bg)}
#loc{font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--bg);background:var(--gold);padding:5px 16px;border-radius:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#obox{background:var(--card);border:1px solid rgba(212,165,116,.12);border-radius:8px;padding:10px 16px;max-width:320px}
.ol{font-family:'DM Sans',sans-serif;font-size:.6rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.ot{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--dim);line-height:1.4}
#timer{font-family:'DM Sans',sans-serif;font-size:1.8rem;font-weight:700;color:var(--pain);text-align:center;margin-top:6px;display:none}
#RA{grid-column:2;grid-row:2;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#RW{position:relative;width:720px;image-rendering:pixelated;border-radius:6px;overflow:hidden}
#RW .bg{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover}
#dov{position:absolute;inset:0;background:rgba(8,5,20,.25);pointer-events:none;transition:opacity 2s}
#pov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 120px rgba(196,92,75,.8),inset 0 0 200px rgba(196,92,75,.4)}
.sp{position:absolute;image-rendering:pixelated;z-index:10;transition:left 1.2s ease-in-out,top 1.2s ease-in-out}
#ss{width:54px;height:54px;z-index:11;display:none}
#drsp{width:54px;height:54px;z-index:10;display:none}
.npc{position:absolute;image-rendering:pixelated;z-index:9}
#BB{grid-column:2;grid-row:3;z-index:30}
#dlg{background:linear-gradient(180deg,rgba(22,18,28,.97),rgba(12,10,16,.99));border-top:2px solid rgba(212,165,116,.15);padding:16px 24px;display:flex;gap:20px;align-items:flex-start;min-height:150px;opacity:0;transform:translateY(10px);transition:all .35s;pointer-events:none;position:relative}
#dlg.on{opacity:1;transform:none;pointer-events:auto}
#dp{width:110px;height:154px;border-radius:8px;border:2px solid rgba(212,165,116,.15);overflow:hidden;flex-shrink:0;background:rgba(20,16,26,.8)}
#dp img{width:100%;height:100%;object-fit:cover}
#dc{flex:1}
#ds{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600}
#dt{font-size:1.15rem;line-height:1.75;color:var(--text);min-height:2.5em}
#dt.i{color:var(--dim);font-style:italic}
#dt.p{color:var(--pain);font-style:italic;font-weight:600}
#dh{position:absolute;bottom:10px;right:24px;font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--dim2);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:.7}}
#ch{padding:16px 24px;background:linear-gradient(180deg,rgba(22,18,28,.97),rgba(12,10,16,.99));border-top:2px solid rgba(212,165,116,.15);display:none}
#ch.on{display:block}
.cb{display:block;width:100%;text-align:left;background:rgba(212,165,116,.04);border:1px solid rgba(212,165,116,.12);color:var(--text);font-family:'Crimson Text',serif;font-size:1.05rem;padding:12px 18px;margin-bottom:8px;border-radius:8px;cursor:pointer;transition:all .2s}
.cb:hover{background:rgba(212,165,116,.12);border-color:var(--gold)}
.cb small{display:block;color:var(--dim);font-size:.85rem;margin-top:3px;font-style:italic}
/* NOTES SPLIT SCREEN */
#notes{display:none;grid-column:2;grid-row:2;z-index:20;padding:20px;background:var(--bg);overflow-y:auto}
#notes.on{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.note-col{background:var(--card);border-radius:8px;padding:20px;border:1px solid rgba(212,165,116,.1)}
.note-col h3{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.note-col p{font-size:1rem;line-height:1.7;margin-bottom:8px}
.note-left p{color:var(--text);font-style:italic}
.note-right p{color:var(--dim);font-family:'DM Sans',sans-serif;font-size:.85rem}
/* TITLE + FADE */
#TS{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#TS.off{opacity:0;pointer-events:none}
#TS h1{font-size:clamp(2rem,6vw,3.5rem);color:var(--gold);letter-spacing:.12em;font-weight:400}
#TS .sub{font-size:clamp(.85rem,2.5vw,1.1rem);color:var(--dim);font-style:italic;margin:.3rem 0 .2rem}
#TS .num{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:2rem}
#TS button{background:none;border:1px solid var(--gold2);color:var(--gold);padding:.8rem 3rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;transition:all .3s}
#TS button:hover{background:var(--gold);color:var(--bg)}
#F{position:fixed;inset:0;z-index:150;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:center}
#F.on{opacity:1;pointer-events:auto}
.ft{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.25em;text-transform:uppercase;opacity:0;transition:opacity .5s}
.fm{font-size:clamp(1.5rem,5vw,2.8rem);color:var(--text);margin-top:.5rem;font-weight:400;opacity:0;transition:opacity .5s}
#F.st .ft,#F.st .fm{opacity:1}
@media(max-width:960px){#game{grid-template-columns:1fr}#LP{display:none}#RW{width:100%}#notes.on{grid-template-columns:1fr}}
</style>
</head>

const MAX_CQ=5;
function mv(x,y,d){const s=$("#ss");s.style.left=x+"%";s.style.top=y+"%";if(d)s.src=SP[d];}
let _tid=0,_adv=null;
function say(sp,tx,po,cl){
return new Promise(res=>{
clearTimeout(_tid);if(_adv){$("#dlg").removeEventListener("click",_adv);document.removeEventListener("keydown",_adv);_adv=null;}
const d=$("#dlg"),t=$("#dt"),im=$("#di");
$("#ds").textContent=sp||"";t.className=cl==="i"?"i":cl==="p"?"p":"";
if(po&&P[po]){im.src=P[po];$("#dp").style.display="block";}else{$("#dp").style.display="none";}
t.textContent="";d.classList.add("on");
let i=0,chars=[...tx],done=false;
const tp=()=>{if(i<chars.length&&!done){t.textContent+=chars[i++];_tid=setTimeout(tp,16);}};tp();
let _adv_fired=false;const adv=(e)=>{if(e&&e.type==="keydown"&&e.key!==" "&&e.key!=="Enter")return;if(e){try{e.preventDefault();e.stopPropagation();}catch(_){}}if(_adv_fired&&i>=chars.length)return;if(i<chars.length){done=true;clearTimeout(_tid);t.textContent=tx;i=chars.length;return;}_adv_fired=true;d.removeEventListener("click",adv);document.removeEventListener("keydown",adv);_adv=null;d.classList.remove("on");setTimeout(res,150);};
_adv=adv;setTimeout(()=>{d.addEventListener("click",adv);document.addEventListener("keydown",adv);},100);});}

function choose(opts){return new Promise(res=>{
const c=$("#ch");c.innerHTML="";
opts.forEach((o,i)=>{const b=document.createElement("button");b.className="cb";
b.innerHTML=o.t+(o.s?`<small>${o.s}</small>`:"");b.onclick=()=>{c.classList.remove("on");res(i);};c.appendChild(b);});
c.classList.add("on");});}

if(a||b){$(".ft").textContent=a||"";$(".fm").textContent=b||"";f.classList.add("st");await W(2200);f.classList.remove("st");await W(500);}}
async function fo(){$("#F").classList.remove("on");await W(800);}

// FIFO: max 5 consequences
if(list.children.length>=MAX_CQ)list.removeChild(list.firstChild);
const d=document.createElement("div");d.className="cq";d.innerHTML=`<b>${t}</b><span>${x}</span>`;list.appendChild(d);}
