<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sofía — Escena 2: El Camino</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#110e16;--card:rgba(22,18,28,.95);--gold:#d4a574;--gold2:#b8895a;--pain:#c45c4b;--text:#ece8e2;--dim:#9a9590;--dim2:#6a6560}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Crimson Text',Georgia,serif}
#game{width:100vw;height:100vh;display:none;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr auto;overflow:hidden}
#LP{grid-column:1;grid-row:1/4;background:linear-gradient(180deg,rgba(22,18,28,.98),rgba(15,12,20,.99));border-right:1px solid rgba(212,165,116,.1);padding:18px 16px;overflow-y:auto;z-index:20}
.lpt{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase}
.lpck{font-size:2.2rem;color:var(--text);font-weight:600;font-family:'DM Sans',sans-serif;margin:2px 0 8px}
.lpsec{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold2);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px;border-top:1px solid rgba(212,165,116,.1);padding-top:12px}
.cq{background:rgba(212,165,116,.05);border:1px solid rgba(212,165,116,.08);border-left:3px solid var(--gold2);border-radius:6px;padding:10px 12px;margin-bottom:8px;animation:sR .4s ease}
.cq b{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold);display:block;margin-bottom:3px;letter-spacing:.05em;text-transform:uppercase}
.cq span{font-size:.85rem;color:var(--dim);line-height:1.5}
@keyframes sR{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
#TB{grid-column:2;grid-row:1;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:15;background:var(--bg)}
#loc{font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--bg);background:var(--gold);padding:5px 16px;border-radius:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#obox{background:var(--card);border:1px solid rgba(212,165,116,.12);border-radius:8px;padding:10px 16px;max-width:300px}
.ol{font-family:'DM Sans',sans-serif;font-size:.6rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.ot{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--dim);line-height:1.4}
#RA{grid-column:2;grid-row:2;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#RW{position:relative;width:720px;image-rendering:pixelated;border-radius:6px;overflow:hidden;transition:height .5s}
#RW .bg{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover}
#dov{position:absolute;inset:0;background:rgba(8,5,20,.3);pointer-events:none;transition:opacity 2s}
#pov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 120px rgba(196,92,75,.8),inset 0 0 200px rgba(196,92,75,.4)}
.sp{position:absolute;image-rendering:pixelated;z-index:10;transition:left 1.2s ease-in-out,top 1.2s ease-in-out}
#ss{width:56px;height:56px;z-index:11;display:none}
.npc{position:absolute;image-rendering:pixelated;z-index:9;transition:left 1s ease,top 1s ease,opacity .6s}
.hs{position:absolute;cursor:pointer;z-index:12;border:2px solid rgba(212,165,116,.2);border-radius:5px;transition:all .3s;animation:hg 2.5s ease-in-out infinite}
.hs:hover{border-color:rgba(212,165,116,.7);background:rgba(212,165,116,.12)}
.hs.done{opacity:.2;animation:none;pointer-events:none;border-color:transparent}
@keyframes hg{0%,100%{border-color:rgba(212,165,116,.12);box-shadow:0 0 0 transparent}50%{border-color:rgba(212,165,116,.4);box-shadow:0 0 16px rgba(212,165,116,.1)}}
.hs .lb{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(10,8,14,.93);border:1px solid var(--gold2);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:.75rem;padding:5px 14px;border-radius:14px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.hs:hover .lb,.hs.pk .lb{opacity:1}
.hs .ic{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.2rem;opacity:.5;transition:opacity .3s}
.hs:hover .ic{opacity:1}
#nav{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:14;opacity:0;transition:opacity .4s}
#nav.on{opacity:1}
.nb{background:rgba(12,10,16,.88);border:1px solid rgba(212,165,116,.2);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:.75rem;padding:6px 16px;border-radius:16px;cursor:pointer;transition:all .2s;white-space:nowrap}
.nb:hover,.nb.ac{background:rgba(212,165,116,.15);border-color:var(--gold)}
#BB{grid-column:2;grid-row:3;z-index:30}
#dlg{background:linear-gradient(180deg,rgba(22,18,28,.97),rgba(12,10,16,.99));border-top:2px solid rgba(212,165,116,.15);padding:16px 24px;display:flex;gap:20px;align-items:flex-start;min-height:150px;opacity:0;transform:translateY(10px);transition:all .35s;pointer-events:none;position:relative}
#dlg.on{opacity:1;transform:none;pointer-events:auto}
#dp{width:110px;height:154px;border-radius:8px;border:2px solid rgba(212,165,116,.15);overflow:hidden;flex-shrink:0;background:rgba(20,16,26,.8)}
#dp img{width:100%;height:100%;object-fit:cover}
#dc{flex:1}
#ds{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600}
#dt{font-size:1.15rem;line-height:1.75;color:var(--text);min-height:2.5em}
#dt.i{color:var(--dim);font-style:italic}
#dt.p{color:var(--pain);font-style:italic;font-weight:600}
#dh{position:absolute;bottom:10px;right:24px;font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--dim2);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:.7}}
#ch{padding:16px 24px;background:linear-gradient(180deg,rgba(22,18,28,.97),rgba(12,10,16,.99));border-top:2px solid rgba(212,165,116,.15);display:none}
#ch.on{display:block}
.cb{display:block;width:100%;text-align:left;background:rgba(212,165,116,.04);border:1px solid rgba(212,165,116,.12);color:var(--text);font-family:'Crimson Text',serif;font-size:1.05rem;padding:12px 18px;margin-bottom:8px;border-radius:8px;cursor:pointer;transition:all .2s}
.cb:hover{background:rgba(212,165,116,.12);border-color:var(--gold)}
.cb small{display:block;color:var(--dim);font-size:.85rem;margin-top:3px;font-style:italic}
#TS{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#TS.off{opacity:0;pointer-events:none}
#TS h1{font-size:clamp(2rem,6vw,3.5rem);color:var(--gold);letter-spacing:.12em;font-weight:400}
#TS .sub{font-size:clamp(.85rem,2.5vw,1.1rem);color:var(--dim);font-style:italic;margin:.3rem 0 .2rem}
#TS .num{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:2rem}
#TS button{background:none;border:1px solid var(--gold2);color:var(--gold);padding:.8rem 3rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;transition:all .3s}
#TS button:hover{background:var(--gold);color:var(--bg)}
#F{position:fixed;inset:0;z-index:150;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:center}
#F.on{opacity:1;pointer-events:auto}
.ft{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.25em;text-transform:uppercase;opacity:0;transition:opacity .5s}
.fm{font-size:clamp(1.5rem,5vw,2.8rem);color:var(--text);margin-top:.5rem;font-weight:400;opacity:0;transition:opacity .5s}
#F.st .ft,#F.st .fm{opacity:1}
@media(max-width:960px){#game{grid-template-columns:1fr}#LP{display:none}#RW{width:100%}}
</style>
</head>

function mv(x,y,d){const s=$("#ss");s.style.left=x+"%";s.style.top=y+"%";s.src=SP[d||"d"];}
let _tid=0,_adv=null;
function say(sp,tx,po,cl){
return new Promise(res=>{
clearTimeout(_tid);
if(_adv){$("#dlg").removeEventListener("click",_adv);document.removeEventListener("keydown",_adv);_adv=null;}
const d=$("#dlg"),t=$("#dt"),im=$("#di");
$("#ds").textContent=sp||"";
t.className=cl==="i"?"i":cl==="p"?"p":"";
if(po&&P[po]){im.src=P[po];$("#dp").style.display="block";}else{$("#dp").style.display="none";}
t.textContent="";d.classList.add("on");
let i=0,chars=[...tx],done=false;
const tp=()=>{if(i<chars.length&&!done){t.textContent+=chars[i++];_tid=setTimeout(tp,18);}};tp();
const adv=(e)=>{
if(e&&e.type==="keydown"&&e.key!==" "&&e.key!=="Enter")return;
if(i<chars.length){done=true;clearTimeout(_tid);t.textContent=tx;i=chars.length;return;}
d.removeEventListener("click",adv);document.removeEventListener("keydown",adv);_adv=null;
d.classList.remove("on");setTimeout(res,150);};
_adv=adv;setTimeout(()=>{d.addEventListener("click",adv);document.addEventListener("keydown",adv);},100);});}
function choose(opts){
return new Promise(res=>{
const c=$("#ch");c.innerHTML="";
opts.forEach((o,i)=>{const b=document.createElement("button");b.className="cb";
b.innerHTML=o.t+(o.s?`<small>${o.s}</small>`:"");b.onclick=()=>{c.classList.remove("on");res(i);};c.appendChild(b);});
c.classList.add("on");
});}

if(a||b){$(".ft").textContent=a||"";$(".fm").textContent=b||"";f.classList.add("st");await W(2200);f.classList.remove("st");await W(500);}}
async function fo(){$("#F").classList.remove("on");await W(800);}

async function tap(id){
if(G.phase!=="explore")return;
const h=HS.find(x=>x.id===id);if(!h)return;
G.phase="dlg";G.explored.add(id);
mv(h.x+(h.x>30?-5:5),Math.min(h.y+4,82),h.x>30?"l":"r");
await W(600);
for(const l of h.L)await say("",l.t,l.p,l.c);
const el=document.getElementById("h_"+id);if(el)el.classList.add("done");
const cnt=G.explored.size,total=HS.length;
if(cnt<total)so(`Explorado: ${cnt} de ${total} — sigue buscando`);
else so("Todo explorado.");
G.phase="explore";
if(cnt>=total&&!G.schoolDone){G.schoolDone=true;await W(600);await teachingMoments();}
}

e.onclick=()=>tap(h.id);c.appendChild(e);});
}

// ========== STREET SCENE ==========
async function streetScene(){
so("Camina a la escuela.");clk("6:30 AM");

await say("","Salgo de la casa. La calle huele a gas y a pan dulce. El sol apenas sale.","s_n","");
await say("","Hoy toca examen de mate con los de tercero. Los de cuarto tienen exposición de ciencias. Tengo que comprar cartulinas y—","s_n","i");

await pf(2500);

await say("","El dolor. Un jalón seco en el vientre. Como si algo adentro se estuviera desgarrando.","s_f","p");
await say("","No es un cólico. Un cólico va y viene. Esto se queda. Esto se instala.","s_f","p");
await say("","Aprieto el bolso contra el abdomen y sigo caminando.","s_s","i");

await say("","Tres noches sin dormir bien. No por insomnio. Por el dolor. Me despierto a las dos, a las tres, empapada en sudor.","s_s","i");
await say("","Las náuseas que suben y bajan. Ayer casi vomité en el camión. No por nervios. Porque algo adentro de mí se mueve mal, se inflama, se hincha.","s_f","i");
await say("","Y la fatiga. No cansancio normal. Una fatiga que pesa. Como si la sangre se hubiera vuelto plomo.","s_s","i");

clk("6:45 AM");
await say("","El puesto de tamales. Doña Itzel ya está ahí, con su olla enorme y su mandil de flores.","s_n","");

await say("Doña Itzel","¡Maestra! ¿De rajas o de dulce?","i_h","");
await say("Sofía","Hoy no, doña Itzel. Se me hace tarde.","s_n","");
await say("Doña Itzel","Uy, pero si está flaquita. ¿Ya desayunó?","i_c","");

const r1=await choose([
{t:"«Es que no me cae bien la comida últimamente...»",s:"Decir algo de lo que le pasa."},
{t:"«Sí, ya comí en casa. Gracias, doña.»",s:"Mentir. Como siempre."},
{t:"«Doña Itzel... ¿puedo preguntarle algo?»",s:"Pedirle consejo."},
]);

if(r1===0){
  await say("Sofía","Es que no me cae bien la comida, doña. Me da mucha náusea. Y un dolor aquí abajo que no se me quita.","s_s","");
  await say("Doña Itzel","¿Y ya fue al doctor?","i_n","");
  await say("Sofía","Tengo cita en el IMSS. La semana que viene.","s_n","");
  
  const r2=await choose([
  {t:"«Pero tengo miedo de que no me hagan caso.»",s:"Ser honesta."},
  {t:"«A ver qué me dicen.»",s:"No dar más detalles."},
  ]);
  
  if(r2===0){
    await say("Sofía","Tengo miedo de que no me hagan caso, doña. Ya fui antes y me dijeron que eran cólicos.","s_s","");
    await say("Doña Itzel","Ay, maestra. Le voy a decir algo. Yo a su edad me doblaba igual. Mi mamá me decía: «eso es normal, a todas nos duele.» Y yo me lo creí.","i_s","");
    await say("Doña Itzel","Ahora de grande me doy cuenta de que no era normal. Pero ya qué, ¿verdad?","i_s","");
  }else{
    await say("Sofía","A ver qué me dicen.","s_n","");
  }
  
  await say("Doña Itzel","Mi hijo Tomás trabaja ahí, de enfermero. Pobre, llega destruido. Dice que el doctor ve cuarenta pacientes al día. ¡Cuarenta! Y el ultrasonido lleva meses descompuesto.","i_s","");
  await say("Doña Itzel","No es que el doctor no quiera, maestra. Es que no le dan con qué. Tomás dice que el doctor se queda hasta tarde revisando expedientes. Que ni come. Pero ¿qué puede hacer solo?","i_n","");
  await say("","Cuarenta pacientes. Un ultrasonido descompuesto. No es que no quieran ayudar. Es que no pueden.","s_s","i");
  
}else if(r1===1){
  await say("Sofía","Sí, ya comí en casa. Gracias, doña.","s_n","");
  await say("","Mentira. No comí. Si como, me da dolor. Si no como, me mareo.","s_s","i");
  await say("Doña Itzel","Mmm. No se ve muy bien, maestra. ¿Segura que está bien?","i_c","");
  await say("Sofía","Sí, doña. Solo ando cansada.","s_n","");
  await say("Doña Itzel","¿Cansada o enferma? Porque esas ojeras no son de cansancio, m'ija.","i_n","");
  await say("","Doña Itzel no me cree. Me conoce demasiado bien.","s_s","i");
  
  const r2b=await choose([
  {t:"«...Bueno, sí me duele un poco el vientre.»",s:"Ceder un poco."},
  {t:"«De verdad, doña. Estoy bien.»",s:"Insistir en la mentira."},
  ]);
  
  if(r2b===0){
    await say("Sofía","...Bueno, sí me duele un poco el vientre. Desde hace rato.","s_s","");
    await say("Doña Itzel","¡Lo sabía! Mire, le voy a dar un consejo. Hágase un té de manzanilla con canela. Mi abuela decía que eso arregla todo lo de abajo.","i_h","");
    await say("","Un té de manzanilla. Para lo que yo tengo. Ojalá fuera tan fácil.","s_s","i");
  }else{
    await say("Sofía","De verdad, doña. Estoy bien.","s_n","");
    await say("Doña Itzel","Bueno, usted sabrá. Pero si se pone mal, Tomás trabaja en el IMSS. Le puede decir a qué horas está más tranquilo el doctor.","i_n","");
  }
  
  await say("Doña Itzel","Mi hijo dice que ese hospital está muy mal. Que el doctor ve cuarenta pacientes al día y no tiene ni ultrasonido. Pero le echa ganas, dice Tomás.","i_s","");
  await say("","Cuarenta pacientes. Sin ultrasonido. El doctor le echa ganas. Pero las ganas no alcanzan para todo.","s_s","i");
  
}else{
  await say("Sofía","Doña Itzel... ¿puedo preguntarle algo?","s_s","");
  await say("Doña Itzel","Claro, maestra. Dígame.","i_n","");
  await say("Sofía","¿Usted alguna vez tuvo un dolor... aquí abajo... que no se le quitaba? No solo con la regla. Todo el tiempo.","s_s","");
  await say("Doña Itzel","Ay, m'ija. Toda mi vida. Mi mamá decía que eso era normal. Que a todas nos duele. Que es el precio de ser mujer.","i_s","");
  await say("Sofía","¿Y nunca fue al doctor?","s_c","");
  await say("Doña Itzel","¿Para qué? Si la vecina, la comadre, mi mamá, todas decían lo mismo. «Es normal.» Y una se lo cree. Porque si todas lo dicen, pues ha de ser cierto, ¿no?","i_s","");
  await say("","«Es normal.» Lo dicen ellas. Lo dicen los doctores. Lo dice todo el mundo. Y si todo el mundo lo dice, ¿por qué me sigo sintiendo tan mal?","s_f","i");
  
  await say("Doña Itzel","Mi hijo Tomás trabaja en el IMSS. Enfermero. Dice que el doctor que tienen ve cuarenta pacientes al día. Que el ultrasonido lleva meses descompuesto. Que si necesitan un especialista, la espera es de medio año.","i_n","");
  await say("Doña Itzel","Tomás dice que el doctor no es malo. Que se queda hasta tarde. Que ni come. Pero que solo no puede con todo.","i_s","");
  await say("Sofía","¿Y entonces... qué se supone que haga?","s_s","");
  await say("Doña Itzel","Ir. Insistir. No dejar que le digan que es normal si usted sabe que no lo es. Aunque le cueste, maestra. Aunque le digan que no.","i_n","");
}

await say("","Me despido de doña Itzel. Sigo caminando. El dolor sigue ahí, constante, sordo, pesado.","s_s","i");
ac("El dolor","6 horas continuas. No paró en toda la noche.");
ac("Doña Itzel","Repite lo que le dijeron a ella. No por mala. Porque nadie le dijo algo diferente.");

clk("7:00 AM");
setLoc("CAMIÓN · RUMBO A LA ESCUELA");so("Llega a la escuela.");
await say("","En el camión. Voy de pie, agarrada del tubo. Un bache.","s_n","");
await pf(4000);
await say("","El golpe me revienta por dentro. Cierro los ojos. Aprieto los dientes.","s_f","p");
await say("","No es como un golpe. Es como si mis órganos estuvieran pegados con algo que se jala. Lento. Sostenido.","s_f","p");
await say("","Abro los ojos. Sonrío. La señora de al lado me cree. Todos me creen.","s_n","i");
}

});

async function teachingMoments(){
