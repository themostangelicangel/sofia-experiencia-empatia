<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sofía — Una Experiencia de Empatía</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#110e16;--card:rgba(22,18,28,.95);--gold:#d4a574;--g2:#b8895a;--pain:#c45c4b;--tx:#ece8e2;--dm:#9a9590;--d2:#6a6560}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Crimson Text',Georgia,serif}

/* LAYOUT */
#G{width:100vw;height:100vh;display:none;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr auto;overflow:hidden}
#LP{grid-column:1;grid-row:1/4;background:linear-gradient(180deg,rgba(22,18,28,.98),rgba(15,12,20,.99));border-right:1px solid rgba(212,165,116,.1);padding:18px 16px;overflow-y:auto;z-index:20}
.lpt{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
.lpck{font-size:2.2rem;color:var(--tx);font-weight:600;font-family:'DM Sans',sans-serif;margin:2px 0 6px}
.lps{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--g2);letter-spacing:.1em;text-transform:uppercase;margin:22px 0 12px;border-top:1px solid rgba(212,165,116,.1);padding-top:14px}
.cq{background:rgba(212,165,116,.05);border:1px solid rgba(212,165,116,.08);border-left:3px solid var(--g2);border-radius:6px;padding:10px 12px;margin-bottom:8px;animation:sR .4s ease}
.cq b{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold);display:block;margin-bottom:3px;letter-spacing:.04em;text-transform:uppercase}
.cq span{font-size:.85rem;color:var(--dm);line-height:1.5}
@keyframes sR{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}

/* TOP BAR */
#TB{grid-column:2;grid-row:1;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;z-index:15;background:var(--bg)}
#loc{font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--bg);background:var(--gold);padding:5px 16px;border-radius:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#obox{background:var(--card);border:1px solid rgba(212,165,116,.12);border-radius:8px;padding:10px 16px;max-width:300px}
.ol{font-family:'DM Sans',sans-serif;font-size:.6rem;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.ot{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--dm);line-height:1.4}
#obar{height:4px;background:rgba(212,165,116,.1);border-radius:2px;margin-top:8px;overflow:hidden}
#ofill{height:100%;background:var(--gold);border-radius:2px;transition:width .5s;width:0%}

/* ROOM */
#RA{grid-column:2;grid-row:2;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#RW{position:relative;width:720px;height:548px;image-rendering:pixelated;border-radius:6px;overflow:hidden}
#RW .bg{width:100%;height:100%;display:block;image-rendering:pixelated}
#dov{position:absolute;inset:0;background:rgba(8,5,20,.48);pointer-events:none;transition:opacity 2s}
#pov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 100px rgba(196,92,75,.8),inset 0 0 200px rgba(196,92,75,.3)}
.sp{position:absolute;image-rendering:pixelated;transition:left 1.2s ease-in-out,top 1.2s ease-in-out}
#ss{width:56px;height:56px;z-index:11;display:none}
#cs{width:52px;height:52px;z-index:9;display:none}
#cn{width:36px;height:24px;z-index:10;display:none}

/* HOTSPOTS */
.hs{position:absolute;cursor:pointer;z-index:12;border:2px solid rgba(212,165,116,.18);border-radius:5px;transition:all .3s;animation:hg 2.5s ease-in-out infinite}
.hs:hover{border-color:rgba(212,165,116,.7);background:rgba(212,165,116,.1)}
.hs.done{opacity:.2;animation:none;pointer-events:none;border-color:transparent}
@keyframes hg{0%,100%{border-color:rgba(212,165,116,.12);box-shadow:0 0 0 transparent}50%{border-color:rgba(212,165,116,.35);box-shadow:0 0 12px rgba(212,165,116,.1)}}
.hs .lb{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(10,8,14,.93);border:1px solid var(--g2);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:.75rem;padding:5px 14px;border-radius:14px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.hs:hover .lb,.hs.pk .lb{opacity:1}
.hs .ic{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.2rem;opacity:.5;transition:opacity .3s}
.hs:hover .ic{opacity:1}

/* NAV */
#nav{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:14;opacity:0;transition:opacity .4s}
#nav.on{opacity:1}
.nb{background:rgba(12,10,16,.88);border:1px solid rgba(212,165,116,.2);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:.75rem;padding:6px 16px;border-radius:14px;cursor:pointer;transition:all .2s;white-space:nowrap}
.nb:hover,.nb.ac{background:rgba(212,165,116,.15);border-color:var(--gold)}

/* DIALOGUE */
#BB{grid-column:2;grid-row:3;z-index:30;min-height:0}
#dlg{background:linear-gradient(180deg,rgba(22,18,28,.97),rgba(12,10,16,.99));border-top:2px solid rgba(212,165,116,.15);padding:16px 22px;display:flex;gap:18px;align-items:flex-start;min-height:150px;opacity:0;transform:translateY(10px);transition:all .35s;pointer-events:none;position:relative}
#dlg.on{opacity:1;transform:none;pointer-events:auto}
#dp{width:110px;height:154px;border-radius:8px;border:2px solid rgba(212,165,116,.15);overflow:hidden;flex-shrink:0;background:rgba(20,16,26,.8)}
#dp img{width:100%;height:100%;object-fit:cover}
#dc{flex:1}
#ds{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600}
#dt{font-size:1.15rem;line-height:1.75;color:var(--tx);min-height:2.8em}
#dt.i{color:var(--dm);font-style:italic}
#dt.p{color:var(--pain);font-style:italic;font-weight:600}
#dh{position:absolute;bottom:10px;right:22px;font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--d2);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:.7}}

/* CHOICES */
#ch{padding:16px 22px;background:linear-gradient(180deg,rgba(22,18,28,.97),rgba(12,10,16,.99));border-top:2px solid rgba(212,165,116,.15);display:none}
#ch.on{display:block}
.cb{display:block;width:100%;text-align:left;background:rgba(212,165,116,.04);border:1px solid rgba(212,165,116,.12);color:var(--tx);font-family:'Crimson Text',serif;font-size:1.05rem;padding:12px 18px;margin-bottom:8px;border-radius:8px;cursor:pointer;transition:all .2s}
.cb:hover{background:rgba(212,165,116,.12);border-color:var(--gold)}
.cb small{display:block;color:var(--dm);font-size:.85rem;margin-top:3px;font-style:italic}

/* TITLE */
#TS{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#TS.off{opacity:0;pointer-events:none}
#TS h1{font-size:clamp(3rem,9vw,5.5rem);color:var(--gold);letter-spacing:.15em;font-weight:400;animation:gl 3s ease-in-out infinite alternate}
#TS .su{font-size:clamp(.9rem,2.5vw,1.15rem);color:var(--dm);font-style:italic;margin:.5rem 0 2.5rem}
#TS button{background:none;border:1px solid var(--g2);color:var(--gold);padding:.8rem 3rem;font-family:inherit;font-size:1.1rem;cursor:pointer;letter-spacing:.12em;border-radius:4px;transition:all .3s}
#TS button:hover{background:var(--gold);color:var(--bg)}
@keyframes gl{from{text-shadow:0 0 20px rgba(212,165,116,.1)}to{text-shadow:0 0 50px rgba(212,165,116,.25)}}

/* FADE */
#F{position:fixed;inset:0;z-index:150;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:center}
#F.on{opacity:1;pointer-events:auto}
.ft{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.25em;text-transform:uppercase;opacity:0;transition:opacity .5s}
.fm{font-size:clamp(1.5rem,5vw,2.8rem);color:var(--tx);margin-top:.5rem;font-weight:400;opacity:0;transition:opacity .5s}
#F.st .ft,#F.st .fm{opacity:1}

@media(max-width:960px){#G{grid-template-columns:1fr}#LP{display:none}#RW{width:100%;height:auto;aspect-ratio:720/548}}
</style></head><body>

<div id="F"><div class="ft"></div><div class="fm"></div></div>
