<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sofía — Escena 6: La Crisis</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&family=Source+Code+Pro:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#110e16;--card:rgba(22,18,28,.95);--gold:#d4a574;--gold2:#b8895a;--pain:#c45c4b;--text:#ece8e2;--dim:#9a9590;--dim2:#6a6560}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Crimson Text',Georgia,serif}
#game{width:100vw;height:100vh;display:none;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr auto;overflow:hidden}
#LP{grid-column:1;grid-row:1/4;background:linear-gradient(180deg,rgba(22,18,28,.98),rgba(15,12,20,.99));border-right:1px solid rgba(212,165,116,.1);padding:18px 16px;overflow-y:auto;z-index:20}
.lpt{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase}
.lpck{font-size:2.2rem;color:var(--text);font-weight:600;font-family:'DM Sans',sans-serif;margin:2px 0 8px}
.lpsec{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold2);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px;border-top:1px solid rgba(212,165,116,.1);padding-top:12px}
.cq{background:rgba(212,165,116,.05);border:1px solid rgba(212,165,116,.08);border-left:3px solid var(--gold2);border-radius:6px;padding:10px 12px;margin-bottom:8px;animation:sR .4s ease}
.cq b{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold);display:block;margin-bottom:3px;letter-spacing:.05em;text-transform:uppercase}
.cq span{font-size:.85rem;color:var(--dim);line-height:1.5}
@keyframes sR{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
#TB{grid-column:2;grid-row:1;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:15;background:var(--bg)}
#loc{font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--bg);background:var(--gold);padding:5px 16px;border-radius:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#obox{background:var(--card);border:1px solid rgba(212,165,116,.12);border-radius:8px;padding:10px 16px;max-width:320px}
.ol{font-family:'DM Sans',sans-serif;font-size:.6rem;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.ot{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--dim);line-height:1.4}
#RA{grid-column:2;grid-row:2;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#RW{position:relative;width:720px;image-rendering:pixelated;border-radius:6px;overflow:hidden}
#RW .bg{width:100%;height:100%;display:block;image-rendering:pixelated}
#dov{position:absolute;inset:0;background:rgba(8,5,20,.1);pointer-events:none;transition:opacity 1s}
#pov{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.p1{box-shadow:inset 0 0 100px rgba(196,92,75,.7),inset 0 0 180px rgba(196,92,75,.3)}
.p2{box-shadow:inset 0 0 140px rgba(180,50,40,.7),inset 0 0 220px rgba(180,50,40,.4)}
.p3{background:rgba(160,35,25,.3);box-shadow:inset 0 0 200px rgba(160,35,25,.95),inset 0 0 350px rgba(140,25,15,.7)}
.p4{background:rgba(140,20,15,.5);box-shadow:inset 0 0 300px rgba(140,20,10,1),inset 0 0 500px rgba(120,10,5,.9)}
.sp{position:absolute;image-rendering:pixelated;z-index:10;transition:left 1s ease-in-out,top 1s ease-in-out}
#ss{width:54px;height:54px;z-index:11;display:none}
.npc{position:absolute;image-rendering:pixelated;z-index:9;transition:opacity .5s}
#BB{grid-column:2;grid-row:3;z-index:30}
#dlg{background:linear-gradient(180deg,rgba(22,18,28,.97),rgba(12,10,16,.99));border-top:2px solid rgba(212,165,116,.15);padding:16px 24px;display:flex;gap:20px;align-items:flex-start;min-height:150px;opacity:0;transform:translateY(10px);transition:all .35s;pointer-events:none;position:relative}
#dlg.on{opacity:1;transform:none;pointer-events:auto}
#dp{width:110px;height:154px;border-radius:8px;border:2px solid rgba(212,165,116,.15);overflow:hidden;flex-shrink:0;background:rgba(20,16,26,.8)}
#dp img{width:100%;height:100%;object-fit:cover}
#dc{flex:1}
#ds{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600}
#dt{font-size:1.15rem;line-height:1.75;color:var(--text);min-height:2.5em}
#dt.i{color:var(--dim);font-style:italic}
#dt.p{color:var(--pain);font-style:italic;font-weight:700}
#dt.scream{color:#ff3333;font-weight:700;font-size:1.3rem;text-transform:uppercase;letter-spacing:.05em}
#dh{position:absolute;bottom:10px;right:24px;font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--dim2);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:.7}}
/* BLACK SCREEN */
#black{display:none;position:fixed;inset:0;z-index:100;background:#050308;overflow-y:auto;padding:0}
#black.on{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:60px 40px 80px;background:#000}
#black .line{color:var(--dim);font-size:1.15rem;line-height:2.1;max-width:580px;text-align:center;opacity:0;transition:opacity 1.2s;margin-bottom:8px}
#black .line.vis{opacity:1}
#black .line.heavy{color:var(--text);font-size:1.3rem;font-weight:700;letter-spacing:.02em}
#black .line.pain{color:var(--pain);font-style:italic;font-size:1.2rem}
#black .gap{height:40px;flex-shrink:0}
#black .btn{margin-top:30px;background:none;border:1px solid var(--gold2);color:var(--gold);padding:.7rem 2.5rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;flex-shrink:0}
/* RESEARCH */
#research{display:none;position:fixed;inset:0;z-index:100;background:#050308;overflow-y:auto;padding:50px 40px 80px}
#research.on{display:block}
#research h2{color:var(--gold);font-family:'DM Sans',sans-serif;font-size:1rem;letter-spacing:.15em;text-transform:uppercase;text-align:center;margin-bottom:2rem}
#research .stat{max-width:600px;margin:0 auto 20px;padding:18px 24px;background:rgba(22,18,28,.6);border:1px solid rgba(212,165,116,.08);border-left:3px solid var(--pain);border-radius:8px}
#research .stat .num{color:var(--pain);font-family:'DM Sans',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:4px}
#research .stat .desc{color:var(--text);font-size:1.05rem;line-height:1.6;margin-bottom:6px}
#research .stat .cite{color:var(--dim2);font-family:'DM Sans',sans-serif;font-size:.72rem;line-height:1.5;font-style:italic}
#research .section-title{max-width:600px;margin:2rem auto 1rem;color:var(--gold2);font-family:'DM Sans',sans-serif;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase}
#research .refs{max-width:600px;margin:2rem auto;padding:20px;background:rgba(22,18,28,.4);border-radius:8px;border:1px solid rgba(212,165,116,.06)}
#research .refs h3{color:var(--gold);font-family:'DM Sans',sans-serif;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
#research .refs p{color:var(--dim);font-size:.78rem;line-height:1.7;margin-bottom:8px;padding-left:2em;text-indent:-2em}
#research .center{text-align:center;max-width:600px;margin:2rem auto}
#research .btn{background:none;border:1px solid var(--gold2);color:var(--gold);padding:.7rem 2.5rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;margin:1rem auto;display:block}
/* DREAM BRIDGE */
#bridge{display:none;position:fixed;inset:0;z-index:100;background:#050308;overflow-y:auto;padding:0}
#bridge.on{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;background:#000}
#bridge .q{color:var(--gold);font-size:clamp(1.8rem,5vw,2.8rem);text-align:center;max-width:600px;line-height:1.6;opacity:0;transition:opacity 1.5s;font-weight:600;letter-spacing:.04em}
#bridge .q.vis{opacity:1}
#bridge .sub{color:var(--dim);font-size:1.15rem;text-align:center;margin-top:1.5rem;opacity:0;transition:opacity 1s;line-height:1.9;max-width:500px}
#bridge .sub.vis{opacity:1}
#bridge .btn{margin-top:3rem;background:none;border:2px solid var(--gold);color:var(--gold);padding:1rem 4rem;font-family:'DM Sans',sans-serif;font-size:1.2rem;cursor:pointer;letter-spacing:.15em;border-radius:4px;opacity:0;transition:opacity 1s;text-transform:uppercase;font-weight:600}
#bridge .btn.vis{opacity:1}
/* TITLE */
#TS{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#TS.off{opacity:0;pointer-events:none}
#TS h1{font-size:clamp(2rem,6vw,3.5rem);color:var(--gold);letter-spacing:.12em;font-weight:400}
#TS .sub{font-size:clamp(.85rem,2.5vw,1.1rem);color:var(--dim);font-style:italic;margin:.3rem 0 .2rem}
#TS .num{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:2rem}
#TS button{background:none;border:1px solid var(--gold2);color:var(--gold);padding:.8rem 3rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;transition:all .3s}
#TS button:hover{background:var(--gold);color:var(--bg)}
#F{position:fixed;inset:0;z-index:150;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:50px 40px;overflow-y:auto}
#F.on{opacity:1;pointer-events:auto}
.ft{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--gold);letter-spacing:.25em;text-transform:uppercase;opacity:0;transition:opacity .5s}
.fm{font-size:clamp(1.5rem,5vw,2.8rem);color:var(--text);margin-top:.5rem;font-weight:400;opacity:0;transition:opacity .5s}
#F.st .ft,#F.st .fm{opacity:1}
@media(max-width:960px){#game{grid-template-columns:1fr}#LP{display:none}#RW{width:100%}}
</style>
</head>

<div id="TS"><div class="num">ESCENA 6</div><h1>La Crisis</h1><div class="sub">Hoy es el día que todo se rompe.</div><button onclick="(function(b){if(b._fired)return;b._fired=true;b.disabled=true;go();})(this)">▶ CONTINUAR</button></div>
<div id="F"><div class="ft"></div><div class="fm"></div></div>
<div id="game">

<div id="TB"><div id="loc">ESCUELA PÚBLICA · SALÓN DE CLASES</div><div id="obox"><div class="ol">OBJETIVO ACTUAL</div><div class="ot" id="otx">Da clase. Aguanta.</div></div></div>

const $=s=>document.querySelector(s);
const W=ms=>new Promise(r=>setTimeout(r,ms));
const MAX_CQ=5;
let _tid=0,_adv=null;
function say(sp,tx,po,cl){
return new Promise(res=>{
clearTimeout(_tid);if(_adv){$("#dlg").removeEventListener("click",_adv);document.removeEventListener("click",_adv);document.removeEventListener("keydown",_adv);document.removeEventListener("touchend",_adv);_adv=null;}
const d=$("#dlg"),t=$("#dt"),im=$("#di");
$("#ds").textContent=sp||"";t.className=cl||"";
if(po&&P[po]){im.src=P[po];$("#dp").style.display="block";}else{$("#dp").style.display="none";}
t.textContent="";d.classList.add("on");
let i=0,chars=[...tx],done=false;
const tp=()=>{if(i<chars.length&&!done){t.textContent+=chars[i++];_tid=setTimeout(tp,cl==="scream"?8:16);}};tp();
let _adv_fired=false;const adv=(e)=>{if(e&&e.type==="keydown"&&e.key!==" "&&e.key!=="Enter")return;if(e){try{e.preventDefault();e.stopPropagation();}catch(_){}}if(_adv_fired&&i>=chars.length)return;if(i<chars.length){done=true;clearTimeout(_tid);t.textContent=tx;i=chars.length;return;}_adv_fired=true;d.removeEventListener("click",adv);document.removeEventListener("click",adv);document.removeEventListener("keydown",adv);document.removeEventListener("touchend",adv);_adv=null;d.classList.remove("on");setTimeout(res,150);};
_adv=adv;setTimeout(()=>{d.addEventListener("click",adv);document.addEventListener("click",adv);document.addEventListener("keydown",adv);document.addEventListener("touchend",adv);},100);});}

async function fi(a,b){const f=$("#F");f.classList.add("on");f.classList.remove("st");await W(800);
if(a||b){$(".ft").textContent=a||"";$(".fm").textContent=b||"";f.classList.add("st");await W(2200);f.classList.remove("st");await W(500);}}
async function fo(){$("#F").classList.remove("on");await W(800);}
function pset(lvl){const p=$("#pov");p.className="p"+lvl;p.style.opacity="1";}
function pclear(){const p=$("#pov");p.style.opacity="0";setTimeout(()=>p.className="",500);}
async function pf(lvl,ms){pset(lvl);await W(ms);pclear();}
function ac(t,x){const l=$("#cql");if(l.children.length>=MAX_CQ)l.removeChild(l.firstChild);
const d=document.createElement("div");d.className="cq";d.innerHTML=`<b>${t}</b><span>${x}</span>`;l.appendChild(d);}
function mv(x,y,d){const s=$("#ss");s.style.left=x+"%";s.style.top=y+"%";if(d)s.src=SP[d];}
function plc(id,src,x,y,w,h){
const el=document.createElement("img");el.className="npc";el.id=id;el.src=src;
el.style.cssText=`left:${x}%;top:${y}%;width:${w}px;height:${h}px`;
$("#npcs").appendChild(el);}
function btn(text){return new Promise(r=>{
const b=document.createElement("button");b.textContent=text;b.className="btn";b.onclick=r;
return b;});}

async function collapse(){
$("#clk").textContent="9:00 AM";
// Setup classroom
$("#RW").style.height="537px";
mv(14,38,"d");$("#ss").style.display="block";
// Students
const seats=[
{x:8,y:48,s:"n0",w:40,h:40},{x:16,y:48,s:"n1",w:38,h:38},

{x:16,y:58,s:"n4",w:40,h:40},
];
seats.forEach((p,i)=>plc("stu"+i,SP[p.s],p.x,p.y,p.w,p.h));
plc("mateo",SP.mateo,24,72,42,42);
await fo();
