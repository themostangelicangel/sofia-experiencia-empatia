<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sofía — Acto II: El Regreso</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e1410;--card:rgba(18,28,22,.95);--hope:#6abf8a;--hope2:#4a9a6a;--gold:#d4c89a;--gold2:#b8a87a;--text:#e8ece8;--dim:#90a590;--dim2:#607060;--pain:#c45c4b;--pov:#7eb8d4}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Crimson Text',Georgia,serif}
#game{width:100vw;height:100vh;display:none;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr auto;overflow:hidden}
#LP{grid-column:1;grid-row:1/4;background:linear-gradient(180deg,rgba(18,28,22,.98),rgba(12,20,15,.99));border-right:1px solid rgba(106,191,138,.1);padding:18px 16px;overflow-y:auto;z-index:20}
.lpt{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--hope);letter-spacing:.15em;text-transform:uppercase}
.lpck{font-size:2.2rem;color:var(--text);font-weight:600;font-family:'DM Sans',sans-serif;margin:2px 0 8px}
.lpsec{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--hope2);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px;border-top:1px solid rgba(106,191,138,.1);padding-top:12px}
.cq{background:rgba(106,191,138,.05);border:1px solid rgba(106,191,138,.08);border-left:3px solid var(--hope2);border-radius:6px;padding:10px 12px;margin-bottom:8px;animation:sR .4s ease}
.cq b{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--hope);display:block;margin-bottom:3px;letter-spacing:.05em;text-transform:uppercase}
.cq span{font-size:.85rem;color:var(--dim);line-height:1.5}
@keyframes sR{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
#TB{grid-column:2;grid-row:1;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:15;background:var(--bg)}
#loc{font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--bg);background:var(--hope);padding:5px 16px;border-radius:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#obox{background:var(--card);border:1px solid rgba(106,191,138,.12);border-radius:8px;padding:10px 16px;max-width:320px}
.ol{font-family:'DM Sans',sans-serif;font-size:.6rem;color:var(--hope);letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.ot{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--dim);line-height:1.4}
#RA{grid-column:2;grid-row:2;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#RW{position:relative;width:720px;image-rendering:pixelated;border-radius:6px;overflow:hidden}
#RW .bg{width:100%;height:100%;display:block;image-rendering:pixelated}
#dov{position:absolute;inset:0;background:rgba(8,20,12,.15);pointer-events:none;transition:opacity 1s}
.sp{position:absolute;image-rendering:pixelated;z-index:10;transition:left 1s ease-in-out,top 1s ease-in-out}
#ss{width:54px;height:54px;z-index:11;display:none}
.npc{position:absolute;image-rendering:pixelated;z-index:9;transition:left 1s ease,top 1s ease,opacity .5s}
.hs{position:absolute;cursor:pointer;z-index:12;border:2px solid rgba(106,191,138,.2);border-radius:5px;transition:all .3s;animation:hg 2.5s ease-in-out infinite}
.hs:hover{border-color:rgba(106,191,138,.7);background:rgba(106,191,138,.12)}
.hs.done{opacity:.2;animation:none;pointer-events:none;border-color:transparent}
@keyframes hg{0%,100%{border-color:rgba(106,191,138,.12)}50%{border-color:rgba(106,191,138,.4);box-shadow:0 0 16px rgba(106,191,138,.1)}}
.hs .lb{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(10,14,10,.93);border:1px solid var(--hope2);color:var(--hope);font-family:'DM Sans',sans-serif;font-size:.75rem;padding:5px 14px;border-radius:14px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.hs:hover .lb,.hs.pk .lb{opacity:1}
.hs .ic{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.1rem;opacity:.5}
.hs:hover .ic{opacity:1}
#BB{grid-column:2;grid-row:3;z-index:30}
#dlg{background:linear-gradient(180deg,rgba(18,28,22,.97),rgba(10,16,12,.99));border-top:2px solid rgba(106,191,138,.15);padding:16px 24px;display:flex;gap:20px;align-items:flex-start;min-height:150px;opacity:0;transform:translateY(10px);transition:all .35s;pointer-events:none;position:relative}
#dlg.on{opacity:1;transform:none;pointer-events:auto}
#dp{width:110px;height:154px;border-radius:8px;border:2px solid rgba(106,191,138,.15);overflow:hidden;flex-shrink:0;background:rgba(16,22,16,.8)}
#dp img{width:100%;height:100%;object-fit:cover}
#dp.round{border-radius:50%;width:130px;height:130px;border:3px solid rgba(106,191,138,.3)}
#dc{flex:1}
#ds{font-family:'DM Sans',sans-serif;font-size:.8rem;color:var(--hope);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600}
#ds.pov-dr{color:var(--pov)}
#ds.pov-mom{color:#d4a574}
#dt{font-size:1.15rem;line-height:1.75;color:var(--text);min-height:2.5em}
#dt.i{color:var(--dim);font-style:italic}
#dt.g{color:var(--hope);font-style:italic}
#dt.gh{color:var(--hope);font-weight:600}
#dt.dr{color:var(--pov);font-style:italic}
#dh{position:absolute;bottom:10px;right:24px;font-family:'DM Sans',sans-serif;font-size:.65rem;color:var(--dim2);animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:.7}}
#ch{padding:16px 24px;background:linear-gradient(180deg,rgba(18,28,22,.97),rgba(10,16,12,.99));border-top:2px solid rgba(106,191,138,.15);display:none}
#ch.on{display:block}
.cb{display:block;width:100%;text-align:left;background:rgba(106,191,138,.04);border:1px solid rgba(106,191,138,.12);color:var(--text);font-family:'Crimson Text',serif;font-size:1.05rem;padding:12px 18px;margin-bottom:8px;border-radius:8px;cursor:pointer;transition:all .2s}
.cb:hover{background:rgba(106,191,138,.12);border-color:var(--hope)}
.cb small{display:block;color:var(--dim);font-size:.85rem;margin-top:3px;font-style:italic}
.cb.goldie{border-color:var(--hope);background:rgba(106,191,138,.08)}
.cb.goldie::before{content:"🐕 "}
/* MINI-GAME */
#mg{display:none;position:absolute;inset:0;z-index:20;background:rgba(10,16,12,.95);padding:20px;overflow-y:auto;flex-direction:column;align-items:center}
#mg.on{display:flex}
#mg h2{color:var(--pov);font-family:'DM Sans',sans-serif;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
#mg .sub{color:var(--dim);font-size:.9rem;margin-bottom:16px;text-align:center;max-width:500px}
#mg .cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:600px;margin-bottom:16px}
#mg .card{background:rgba(22,38,28,.8);border:2px solid rgba(106,191,138,.15);border-radius:8px;padding:12px 16px;font-size:.95rem;color:var(--text);cursor:pointer;transition:all .2s;min-width:140px;text-align:center;font-family:'DM Sans',sans-serif}
#mg .card:hover{border-color:var(--hope);background:rgba(106,191,138,.1)}
#mg .card.sel{border-color:var(--hope);background:rgba(106,191,138,.15);box-shadow:0 0 12px rgba(106,191,138,.2)}
#mg .card.wrong{border-color:var(--pain);background:rgba(196,92,75,.1)}
#mg .card.right{border-color:var(--hope);background:rgba(106,191,138,.2)}
#mg .btn{background:none;border:1px solid var(--hope2);color:var(--hope);padding:.6rem 2rem;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;margin-top:10px}
#mg .result{color:var(--text);font-size:1rem;text-align:center;max-width:500px;line-height:1.7;margin:10px 0}
#mg .result .tip{color:var(--hope);font-style:italic}
/* POV BANNER */
.pov-banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:15;font-family:'DM Sans',sans-serif;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;padding:6px 20px;border-radius:20px;opacity:0;transition:opacity .5s}
.pov-banner.on{opacity:1}
.pov-sofia{background:rgba(106,191,138,.15);color:var(--hope);border:1px solid rgba(106,191,138,.2)}
.pov-dr{background:rgba(126,184,212,.15);color:var(--pov);border:1px solid rgba(126,184,212,.2)}
.pov-mom{background:rgba(212,165,116,.15);color:#d4a574;border:1px solid rgba(212,165,116,.2)}
/* SCORECARD */
#scorecard{display:none;position:fixed;inset:0;z-index:100;background:rgba(5,10,6,.97);flex-direction:column;align-items:center;justify-content:center;padding:40px;overflow-y:auto}
#scorecard.on{display:flex}
#scorecard h2{color:var(--hope);font-family:'DM Sans',sans-serif;font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1.5rem}
#scorecard .row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
#scorecard .cat{color:var(--dim);font-family:'DM Sans',sans-serif;font-size:.85rem;width:180px;text-align:right}
#scorecard .paws{display:flex;gap:4px}
#scorecard .paw{font-size:1.3rem;opacity:.15;transition:opacity .3s}
#scorecard .paw.on{opacity:1}
#scorecard .grade{color:var(--hope);font-family:'DM Sans',sans-serif;font-size:.75rem;margin-left:8px}
#scorecard .btn{margin-top:2rem;background:none;border:1px solid var(--hope2);color:var(--hope);padding:.7rem 2.5rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px}
/* TITLE + FINAL */
#TS{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#TS.off{opacity:0;pointer-events:none}
#TS h1{font-size:clamp(2rem,6vw,3.5rem);color:var(--hope);letter-spacing:.12em;font-weight:400}
#TS .sub{font-size:clamp(.85rem,2.5vw,1.1rem);color:var(--dim);font-style:italic;margin:.3rem 0 .2rem}
#TS .num{font-family:'DM Sans',sans-serif;font-size:.7rem;color:var(--hope2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:2rem}
#TS button{background:none;border:1px solid var(--hope2);color:var(--hope);padding:.8rem 3rem;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:.1em;border-radius:4px;transition:all .3s}
#TS button:hover{background:var(--hope);color:var(--bg)}
#F{position:fixed;inset:0;z-index:150;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:50px 40px;overflow-y:auto}
#F.on{opacity:1;pointer-events:auto}
.ft{font-family:'DM Sans',sans-serif;font-size:.75rem;color:var(--hope);letter-spacing:.25em;text-transform:uppercase;opacity:0;transition:opacity .5s}
.fm{font-size:clamp(1.5rem,5vw,2.8rem);color:var(--text);margin-top:.5rem;font-weight:400;opacity:0;transition:opacity .5s}
#F.st .ft,#F.st .fm{opacity:1}
#final{display:none;position:fixed;inset:0;z-index:200;background:#000;overflow-y:auto;flex-direction:column;align-items:center;justify-content:flex-start;padding:60px 40px 80px}
#final.on{display:flex}
#final .ln{color:var(--dim);font-size:1.2rem;line-height:2.2;max-width:560px;text-align:center;opacity:0;transition:opacity 1.2s;margin-bottom:6px}
#final .ln.vis{opacity:1}
#final .ln.big{color:var(--hope);font-size:1.8rem;font-weight:600}
#final .ln.glow{color:var(--hope);text-shadow:0 0 30px rgba(106,191,138,.4)}
@media(max-width:960px){#game{grid-template-columns:1fr}#LP{display:none}#RW{width:100%}}
</style>
</head>

<div id="TS"><div class="num">ACTO II</div><h1>El Regreso</h1><div class="sub">¿Y si esta vez es diferente?</div><button onclick="(function(b){if(b._fired)return;b._fired=true;b.disabled=true;go();})(this)">▶ DESPERTAR</button></div>
<div id="F"><div class="ft"></div><div class="fm"></div></div>
<div id="game">

<div id="TB"><div id="loc">CASA DE SOFÍA</div><div id="obox"><div class="ol">OBJETIVO ACTUAL</div><div class="ot" id="otx"></div></div></div>

const $=s=>document.querySelector(s);
const W=ms=>new Promise(r=>setTimeout(r,ms));
let _tid=0,_adv=null;
const SC={sofia:0,doctor:0,mama:0}; // scorecard

function say(sp,tx,po,cl,round){
return new Promise(res=>{
clearTimeout(_tid);if(_adv){$("#dlg").removeEventListener("click",_adv);document.removeEventListener("keydown",_adv);_adv=null;}
const d=$("#dlg"),t=$("#dt"),im=$("#di"),dp=$("#dp"),ds=$("#ds");
ds.textContent=sp||"";ds.className="";t.className=cl||"";
dp.className=round?"round":"";
if(po&&P[po]){im.src=P[po];dp.style.display="block";}else{dp.style.display="none";}
t.textContent="";d.classList.add("on");
let i=0,chars=[...tx],done=false;
const tp=()=>{if(i<chars.length&&!done){t.textContent+=chars[i++];_tid=setTimeout(tp,16);}};tp();
let _adv_fired=false;const adv=(e)=>{if(e&&e.type==="keydown"&&e.key!==" "&&e.key!=="Enter")return;if(e){try{e.preventDefault();e.stopPropagation();}catch(_){}}if(_adv_fired&&i>=chars.length)return;if(i<chars.length){done=true;clearTimeout(_tid);t.textContent=tx;i=chars.length;return;}_adv_fired=true;d.removeEventListener("click",adv);document.removeEventListener("keydown",adv);_adv=null;d.classList.remove("on");setTimeout(res,150);};
_adv=adv;setTimeout(()=>{d.addEventListener("click",adv);document.addEventListener("keydown",adv);},100);});}

function gsay(tx,cl){return say("Goldie",tx,"g_s",cl||"g",true);}
function dsay(sp,tx,po,cl){$("#ds").className="pov-dr";return say(sp,tx,po,cl);}
function msay(sp,tx,po,cl){$("#ds").className="pov-mom";return say(sp,tx,po,cl);}

function choose(opts){return new Promise(res=>{const c=$("#ch");c.innerHTML="";
opts.forEach((o,i)=>{const b=document.createElement("button");b.className="cb"+(o.g?" goldie":"");
b.innerHTML=o.t+(o.s?`<small>${o.s}</small>`:"");b.onclick=()=>{c.classList.remove("on");res(i);};c.appendChild(b);});c.classList.add("on");});}

async function fi(a,b){const f=$("#F");f.classList.add("on");f.classList.remove("st");await W(800);
if(a||b){$(".ft").textContent=a||"";$(".fm").textContent=b||"";f.classList.add("st");await W(2200);f.classList.remove("st");await W(500);}}
async function fo(){$("#F").classList.remove("on");await W(800);}
function ac(t,x){const l=$("#cql");const d=document.createElement("div");d.className="cq";d.innerHTML=`<b>${t}</b><span>${x}</span>`;l.appendChild(d);}
function so(t){$("#otx").textContent=t;}
function clk(t){$("#clk").textContent=t;}
function setLoc(t){$("#loc").textContent=t;}
function setBg(src,h){$("#bgimg").src=src;if(h)$("#RW").style.height=h;}
function mv(x,y,d){const s=$("#ss");s.style.left=x+"%";s.style.top=y+"%";if(d)s.src=SP[d];}
function clearAll(){$("#npcs").innerHTML="";$("#hsc").innerHTML="";}
function plc(id,src,x,y,w,h){
const el=document.createElement("img");el.className="npc";el.id=id;el.src=src;
el.style.cssText=`left:${x}%;top:${y}%;width:${w}px;height:${h}px`;
$("#npcs").appendChild(el);return el;}
function setPov(type,label){const b=$("#povb");b.className="pov-banner pov-"+type+" on";b.textContent=label;}
function clearPov(){$("#povb").className="pov-banner";}

function mkHS(list,onDone){
const c=$("#hsc");c.innerHTML="";let explored=new Set();
list.forEach(h=>{const e=document.createElement("div");e.className="hs";e.id="h_"+h.id;
e.style.cssText=`left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%`;
e.innerHTML=`<span class="lb">${h.lb}</span><span class="ic">${h.ic}</span>`;
e.onclick=async()=>{if(e.classList.contains("done"))return;explored.add(h.id);
mv(h.x+(h.x>50?-5:5),Math.min(h.y+4,85),h.x>50?"l":"r");await W(500);
for(const l of h.L)await say(l.sp||"",l.t,l.p,l.c);
e.classList.add("done");
if(explored.size>=list.length){await W(500);onDone();}};
c.appendChild(e);});
document.querySelectorAll(".hs").forEach((h,i)=>{setTimeout(()=>h.classList.add("pk"),i*200);setTimeout(()=>h.classList.remove("pk"),3000+i*200);});}

mv(86,74,"d");

// ===== THE CHART MINI-GAME =====
async function theChart(){
return new Promise(resolve=>{
const mg=$("#mg");
async function attempt(){
mg.innerHTML=`
<h2>🩺 EL EXPEDIENTE</h2>
<div class="sub">Eres el Dr. Méndez. Mira los síntomas de Sofía y selecciona los que forman un patrón clínico consistente con endometriosis. Selecciona los correctos y presiona "Evaluar".</div>
<div class="cards" id="mgcards"></div>
<button class="btn" id="mgeval">EVALUAR</button>
<div class="result" id="mgres"></div>`;

const symptoms=[
{id:"s1",t:"Dolor pélvico fuera de la menstruación",right:true},
{id:"s2",t:"Fatiga crónica",right:true},
{id:"s3",t:"Dolor durante relaciones sexuales",right:true},
{id:"s4",t:"Sangrado abundante y prolongado",right:true},
{id:"s5",t:"Dolor de cabeza ocasional",right:false},
{id:"s6",t:"Náuseas frecuentes",right:true},
{id:"s7",t:"Dolor de garganta recurrente",right:false},
{id:"s8",t:"No puede trabajar 2-3 días al mes",right:true},
];

const sel=new Set();
const cards=mg.querySelector("#mgcards");
symptoms.forEach(s=>{
const c=document.createElement("div");c.className="card";c.textContent=s.t;c.dataset.id=s.id;
c.onclick=()=>{if(sel.has(s.id)){sel.delete(s.id);c.classList.remove("sel");}else{sel.add(s.id);c.classList.add("sel");}};
cards.appendChild(c);});

mg.classList.add("on");

mg.querySelector("#mgeval").onclick=async()=>{
const correct=symptoms.filter(s=>s.right).map(s=>s.id);
const wrong=symptoms.filter(s=>!s.right).map(s=>s.id);
let score=0;let mistakes=[];
correct.forEach(id=>{if(sel.has(id))score++;});
wrong.forEach(id=>{if(sel.has(id)){score--;mistakes.push(id);}});

document.querySelectorAll("#mgcards .card").forEach(c=>{
const s=symptoms.find(x=>x.id===c.dataset.id);
if(s.right)c.classList.add("right");
if(!s.right&&sel.has(s.id))c.classList.add("wrong");});

const res=mg.querySelector("#mgres");
if(score>=4){
SC.doctor+=3;
res.innerHTML=`<span class="tip">🐕 ¡Bien hecho, doctor!</span><br>Identificaste el patrón. Dolor fuera de la menstruación + fatiga + dispareunia + sangrado + náuseas + impacto laboral = esto no son «cólicos normales». Las guías ACOG 2026 permiten un diagnóstico clínico con este patrón.`;
await W(1500);
const btn=document.createElement("button");btn.className="btn";btn.textContent="▶ CONTINUAR";
btn.onclick=()=>{mg.classList.remove("on");resolve();};
res.appendChild(btn);
}else{
SC.doctor+=1;
res.innerHTML=`<span class="tip">🐕 Casi, doctor. Revisemos.</span><br>Algunos síntomas no son parte del patrón de endometriosis (dolor de cabeza y garganta). Concéntrate en: dolor pélvico fuera de la menstruación, fatiga, dolor durante relaciones, sangrado abundante, náuseas e impacto laboral.`;
const btn=document.createElement("button");btn.className="btn";btn.textContent="🔄 INTENTAR DE NUEVO";
btn.onclick=()=>attempt();
res.appendChild(btn);
}};
}
attempt();
});}

{name:"Lenguaje de Sofía",score:SC.sofia,max:4},
{name:"Decisiones del Doctor",score:SC.doctor,max:3},
{name:"Apoyo de Mamá",score:SC.mama,max:3},
];
let html='<h2>🐾 Tu Puntuación</h2>';
cats.forEach(c=>{
const paws=Math.min(3,Math.ceil(c.score/c.max*3));
const labels=["Bueno","Muy bueno","Excelente"];
html+=`<div class="row"><div class="cat">${c.name}</div><div class="paws">`;
for(let i=0;i<3;i++) html+=`<span class="paw${i<paws?" on":""}">🐾</span>`;
html+=`</div><div class="grade">${labels[Math.max(0,paws-1)]}</div></div>`;
});
html+='<button class="btn" id="scBtn">▶ CONTINUAR</button>';
sc.innerHTML=html;sc.classList.add("on");
await new Promise(r=>{document.getElementById("scBtn").onclick=r;});
sc.classList.remove("on");
await finalScreen();
}
